---
layout: panel
title: Admin
description: Manage the show list for The Crosstown Shuttle.
permalink: /admin/
noindex: true
sitemap: false
---

<div data-boot class="py-16 text-center">
  <p class="font-display text-sm font-bold uppercase tracking-[0.18em] text-muted">Loading</p>
</div>

<section data-login hidden>
  <div class="card mx-auto max-w-sm p-6 sm:p-8">
    <h1 class="text-2xl">Sign in</h1>
    <p class="mt-3 text-sm leading-relaxed text-muted">
      Enter the band password to change the show list.
    </p>
    <form data-login-form class="mt-6">
      <label class="field-label" for="admin-password">Password</label>
      <input class="field" id="admin-password" name="password" type="password" required
             autocomplete="current-password" autofocus>
      <button type="submit" class="btn btn-brand mt-5 w-full" data-login-submit>Sign in</button>
      <p data-login-error role="alert" class="mt-4 hidden text-sm text-brand"></p>
    </form>
  </div>
</section>

<section data-editor hidden>
  <div class="flex flex-wrap items-end justify-between gap-4">
    <div>
      <h1 class="text-3xl sm:text-4xl">Shows</h1>
      <p class="mt-2 text-sm text-muted">
        Press Edit to change one show. Each show saves on its own.
      </p>
    </div>
    <button type="button" class="btn btn-brand" data-add-show>Add a show</button>
  </div>

  <div class="mt-6 flex flex-wrap items-center justify-between gap-x-6 gap-y-3 border-b-2 border-line pb-4">
    <div class="flex flex-wrap gap-2" role="group" aria-label="Which shows to list">
      <button type="button" data-filter="upcoming" class="btn btn-brand !px-4 !py-2 !text-[0.7rem]">
        Upcoming <span data-count="upcoming" class="opacity-60">0</span>
      </button>
      <button type="button" data-filter="past" class="btn btn-quiet !px-4 !py-2 !text-[0.7rem]">
        Past <span data-count="past" class="opacity-60">0</span>
      </button>
      <button type="button" data-filter="all" class="btn btn-quiet !px-4 !py-2 !text-[0.7rem]">
        All <span data-count="all" class="opacity-60">0</span>
      </button>
    </div>
    <p data-editor-status role="status" aria-live="polite" class="text-sm text-muted"></p>
  </div>

  <p data-editor-error role="alert" hidden class="card mt-6 border-brand/60 bg-brand/10 p-4 text-sm text-chalk"></p>

  <ol data-show-rows class="mt-6 space-y-3"></ol>

  <div data-editor-empty hidden class="card mt-6 px-6 py-12 text-center">
    <p data-empty-title class="font-display text-base font-extrabold uppercase tracking-tight"></p>
    <p data-empty-text class="mx-auto mt-3 max-w-sm text-sm leading-relaxed text-muted"></p>
  </div>
</section>

<template data-show-template>
  <li class="card" data-show-row>
    <input type="hidden" data-field="id" value="">

    <div class="flex items-center gap-3 p-3 sm:gap-4 sm:p-4">
      <div class="flex w-14 shrink-0 flex-col border-2 border-line text-center sm:w-16">
        <p data-summary-weekday
           class="border-b-2 border-line bg-ink-700 py-0.5 font-display text-[0.6rem] font-bold uppercase tracking-[0.14em] text-muted"></p>
        <div class="px-1 py-1.5">
          <p data-summary-day class="font-display text-lg font-extrabold leading-none sm:text-xl"></p>
          <p data-summary-month
             class="mt-0.5 font-display text-[0.6rem] font-bold uppercase tracking-[0.14em] text-muted"></p>
        </div>
      </div>

      <div class="min-w-0 flex-1">
        <p class="flex flex-wrap items-center gap-x-2 gap-y-1">
          <span data-summary-venue class="font-display text-base font-extrabold uppercase tracking-tight sm:text-lg"></span>
          <span data-summary-past hidden
                class="plate plate-brand shrink-0 !px-2 !py-1 text-[0.55rem] tracking-[0.16em]">Past</span>
        </p>
        <p data-summary-meta class="mt-1 truncate text-sm text-muted"></p>
      </div>

      <button type="button" data-edit-show class="btn btn-quiet shrink-0 !px-4 !py-2 !text-[0.7rem]">Edit</button>
    </div>

    <div data-form hidden class="border-t-2 border-line p-3 sm:p-4">
      <div class="grid gap-4 sm:grid-cols-4">
        <div class="sm:col-span-2">
          <label class="field-label">Date</label>
          <input class="field" data-field="date" type="date" required>
        </div>
        <div>
          <label class="field-label">Starts</label>
          <input class="field" data-field="start_time" type="time">
        </div>
        <div>
          <label class="field-label">Ends</label>
          <input class="field" data-field="end_time" type="time">
        </div>

        <div class="sm:col-span-2">
          <label class="field-label">Venue</label>
          <input class="field" data-field="venue" type="text" maxlength="120" placeholder="The Tap Room" required>
        </div>
        <div class="sm:col-span-2">
          <label class="field-label">Town</label>
          <input class="field" data-field="city" type="text" maxlength="120" placeholder="Kingston, NY">
        </div>

        <div class="sm:col-span-2">
          <label class="field-label">Street address <span class="normal-case tracking-normal">(optional)</span></label>
          <input class="field" data-field="address" type="text" maxlength="200" placeholder="12 Main Street">
        </div>
        <div class="sm:col-span-2">
          <label class="field-label">Venue website <span class="normal-case tracking-normal">(optional)</span></label>
          <input class="field" data-field="url" type="url" maxlength="300" placeholder="https://">
        </div>

        <div class="sm:col-span-4">
          <label class="field-label">Note <span class="normal-case tracking-normal">(optional)</span></label>
          <input class="field" data-field="notes" type="text" maxlength="280" placeholder="No cover, outside on the patio">
        </div>
      </div>

      <p data-row-error role="alert" hidden class="mt-4 text-sm text-brand"></p>

      <div class="mt-5 flex flex-wrap items-center justify-between gap-3">
        <button type="button" data-remove-show
                class="font-display text-[0.7rem] font-bold uppercase tracking-[0.14em] text-muted underline decoration-line-bright underline-offset-4 hover:text-brand">
          Remove
        </button>
        <div class="flex items-center gap-3">
          <button type="button" data-cancel-edit class="btn btn-quiet !px-4 !py-2 !text-[0.7rem]">Cancel</button>
          <button type="button" data-save-show class="btn btn-brand !px-5 !py-2 !text-[0.7rem]">Save</button>
        </div>
      </div>
    </div>
  </li>
</template>
