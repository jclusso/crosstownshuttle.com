{%- assign photos = site.data.photos -%}
{%- if photos and photos.size > 0 -%}
<section id="photos" class="border-b-2 border-line py-16 sm:py-24">
  <div class="mx-auto max-w-5xl px-4 sm:px-6">
    {% include section-heading.html eyebrow="Photo car" title="On the road" %}

    <ul class="mt-10 grid grid-cols-2 gap-3 sm:gap-4 lg:grid-cols-4">
      {%- for photo in photos %}
      <li>
        <button type="button" data-lightbox-open data-src="{{ photo.src }}" data-alt="{{ photo.alt | escape }}"
              class="group block w-full overflow-hidden border-2 border-line bg-ink-800 transition-colors hover:border-brand">
          <img src="{{ photo.src }}" alt="{{ photo.alt }}" loading="lazy" decoding="async"
             class="aspect-[4/3] w-full object-cover object-top transition-transform duration-300 group-hover:scale-[1.03]">
        </button>
      </li>
      {%- endfor %}
    </ul>
  </div>
</section>

<dialog data-lightbox class="m-0 h-full max-h-none w-full max-w-none border-0 bg-transparent p-0 backdrop:bg-ink/90 backdrop:backdrop-blur-sm">
  <div data-lightbox-surface class="relative flex h-full w-full items-center justify-center px-14 py-16 sm:px-20 sm:py-20">
    <img data-lightbox-image src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="" class="max-h-full max-w-full border-2 border-line object-contain">

    <button type="button" data-lightbox-close
            class="absolute right-3 top-3 flex size-11 items-center justify-center border-2 border-line bg-ink/90 text-chalk transition-colors hover:border-brand sm:right-5 sm:top-5 sm:size-12">
      <span class="sr-only">Close</span>
      <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true">
        <path d="M6 6l12 12M18 6L6 18" stroke-linecap="round"/>
      </svg>
    </button>

    <button type="button" data-lightbox-prev
            class="absolute left-3 top-1/2 sm:left-5 flex size-11 -translate-y-1/2 items-center justify-center border-2 border-line bg-ink/90 text-chalk transition-colors hover:border-brand sm:size-12">
        <span class="sr-only">Previous photo</span>
        <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true">
          <path d="M15 5l-7 7 7 7" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>

    <button type="button" data-lightbox-next
            class="absolute right-3 top-1/2 sm:right-5 flex size-11 -translate-y-1/2 items-center justify-center border-2 border-line bg-ink/90 text-chalk transition-colors hover:border-brand sm:size-12">
        <span class="sr-only">Next photo</span>
        <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true">
          <path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>

    <p data-lightbox-counter aria-live="polite"
       class="absolute bottom-4 left-1/2 -translate-x-1/2 border-2 border-line bg-ink/90 px-3 py-1.5 font-display text-[0.65rem] font-bold uppercase tracking-[0.16em] text-muted sm:bottom-6"></p>
  </div>
</dialog>
{%- endif -%}
