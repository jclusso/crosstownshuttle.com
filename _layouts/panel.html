<!doctype html>
<html lang="{{ site.lang }}" class="bg-ink">
<head>
  {%- include head.html %}
</head>
<body class="min-h-dvh">
  <header class="border-b-2 border-line bg-ink-800">
    <div class="mx-auto flex h-16 max-w-4xl items-center justify-between gap-4 px-4 sm:px-6">
      <a href="/" class="flex items-center gap-3">
        <img src="/assets/images/logo.svg" alt="Crosstown Shuttle" width="3000" height="992" class="h-7 w-auto">
        <span class="font-display text-sm font-extrabold uppercase tracking-tight text-muted">{{ page.title }}</span>
      </a>
      <div class="flex items-center gap-2">
        <a href="/" class="font-display text-xs font-bold uppercase tracking-[0.16em] text-muted hover:text-chalk">View site</a>
        <button type="button" data-sign-out class="btn btn-quiet hidden !px-3.5 !py-2 !text-[0.7rem]">Sign out</button>
      </div>
    </div>
  </header>
  <main class="mx-auto max-w-4xl px-4 py-10 sm:px-6 sm:py-14">
    {{ content }}
  </main>
  <script src="/assets/js/band-admin.js?v={{ site.time | date: '%s' }}" defer></script>
</body>
</html>
