blurb: >-
  The Crosstown Shuttle is a dynamic musical duo with the full, energetic sound
  often associated with a three- or four-piece band. Charlie brings guitar and
  vocals, while Beverly adds keyboards and vocals, with both sharing lead and
  harmony vocals throughout their performances. Their extensive repertoire
  covers a wide variety of musical styles, from classic favorites to
  contemporary hits, all performed with their own unique arrangements and
  personal style. Whether performing for longtime fans or new audiences, the
  Crosstown Shuttle delivers a polished, engaging, and versatile live experience
  that keeps people listening, singing along, and coming back for more.

