# Gallery photos, in the order they appear. The section hides itself if this
# list is empty.
#
# To use real photos: drop files into assets/images/photos/, point `src` at
# them and write a real `alt` line. Landscape JPGs around 1600px wide look
# best. Delete any placeholder entries you have not filled in.
#
# `featured: true` makes a tile span two columns on wide screens.

