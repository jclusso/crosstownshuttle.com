# Gallery photos, in the order they appear. The section hides itself if this
# list is empty.
#
# Web copies live in assets/images/photos/. The full-size originals live in
# assets/images/originals/photos/. To add a photo: put the original in the
# originals folder, export a copy at 1600px on the long edge into
# assets/images/photos/, and add an entry here with a real `alt` line.
#
# The grid is 2 across on phones and 4 across on wide screens, so keep the
# count a multiple of 4 for even rows.

